# FieldOpt — full-Postgres stack. No application server and no external scheduler:
# Postgres renders the console (PostgREST exposes it as RPC, nginx proxies), and pg_cron
# drives the simulation clock from inside the database.
#
# Run:   make up      (then: make pg-apply, make pg-seed)
# Demo:  make demo    (flips the app.is_demo flag)
#
# Browse: http://localhost:8081

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    image: fieldopt-postgres:pgcron
    container_name: fieldopt-postgres
    command: >
      postgres -c shared_preload_libraries=pg_cron -c cron.database_name=fieldopt
    environment:
      POSTGRES_USER: fieldopt
      POSTGRES_PASSWORD: fieldopt
      POSTGRES_DB: fieldopt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldopt"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgrest
    container_name: fieldopt-postgrest
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: fieldopt-web
    ports:
      - "8081:80"
    depends_on:
      - postgrest

volumes:
  postgres_data:
