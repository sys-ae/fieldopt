# FieldOpt web tier — static shell + reverse proxy to PostgREST.
# Standalone on purpose: docker-compose mounts this file, and the raw/no-Docker
# flavor drops it into a stock nginx unchanged. Nothing Docker-specific belongs here
# except the `postgrest` upstream name, which raw installs point at localhost.

upstream postgrest {
	server postgrest:3000;
}

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;

	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
	}

	# The console is rendered by Postgres, fragments and all. nginx does no assembly —
	# it proxies / to the shell function and otherwise serves static assets.
	location = / {
		proxy_pass http://postgrest/rpc/shell;
		proxy_set_header Accept "text/html";
		proxy_http_version 1.1;
	}

	location /rpc/ {
		proxy_pass http://postgrest/rpc/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri =404;
	}

	location ~ /\. {
		deny all;
	}
}
